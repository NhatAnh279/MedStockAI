services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medstock
      POSTGRES_PASSWORD: medstock
      POSTGRES_DB: medstock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medstock -d medstock"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://medstock:medstock@db:5432/medstock
      CORS_ORIGINS: http://localhost:3000
      # Set to your LAN IP so QR codes work on devices connected to the same WiFi.
      # e.g. NETWORK_HOST: 192.168.1.10
      # Leave as "auto" to detect at runtime (works for localhost testing).
      NETWORK_HOST: ${NETWORK_HOST:-auto}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
